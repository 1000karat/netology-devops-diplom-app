name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: 
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          CURRENT_VERSION=$(cat VERSION)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/netology-nginx-app:${{ steps.version.outputs.version }} \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/netology-nginx-app:${{ steps.version.outputs.version }}

      - name: Deploy to VM
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            VERSION="${{ steps.version.outputs.version }}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/netology-nginx-app:${VERSION}"

            docker pull "$IMAGE"

            docker stop netology-nginx 2>/dev/null || true
            docker rm netology-nginx 2>/dev/null || true

            docker run -d \
              --name netology-nginx \
              --restart always \
              -p 80:80 \
              "$IMAGE"

            docker image prune -f

      - name: Update version in repository
        if: success() && github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "$VERSION" > VERSION

          sed -i -E "s/^version: [0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/version: ${VERSION}/" README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION README.md

          git commit -m "chore: release $VERSION [skip ci]"

          git push
